<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>TokenRouter</title>
  <defs>
    <linearGradient id="tr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="tr-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#tr-bg)"/>
  <!-- Three node dots representing token routing -->
  <circle cx="14" cy="18" r="3" fill="url(#tr-stroke)"/>
  <circle cx="50" cy="14" r="3" fill="#fbbf24"/>
  <circle cx="50" cy="50" r="3" fill="#34d399"/>
  <!-- Routing lines connecting them -->
  <path d="M 17 19 L 47 16" stroke="url(#tr-stroke)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 17 20 L 47 48" stroke="url(#tr-stroke)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
  <!-- T letter (Token) in lower-right -->
  <path d="M 30 40 L 44 40 M 37 40 L 37 54" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- R letter to the right of T (Router) -->
  <path d="M 48 40 L 48 54 M 48 40 Q 53 40 53 44 Q 53 47 48 47 L 54 54" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0"/>
</svg>
